<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCLeadProspecta — Memocash Soluções</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:        #080f09;
  --surface:   #0d1a0e;
  --card:      #111e12;
  --card2:     #152018;
  --input-bg:  #192b1a;
  --border:    #1e3d20;
  --verde:     #1e8a2e;
  --verde-lt:  #27ae3f;
  --verde-dim: #145c1f;
  --verde-glow:#27ae3f40;
  --branco:    #e4f0e5;
  --cinza:     #6a957a;
  --log:       #7dba85;
  --accent:    #4ade6a;
  --danger:    #e05252;
  --warn:      #f0a04a;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--branco);
  font-family:'Syne',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── grade de pontos no fundo ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:radial-gradient(circle,#1e8a2e18 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;z-index:0;
}

/* ── brilho superior ── */
body::after{
  content:'';
  position:fixed;top:-200px;left:50%;transform:translateX(-50%);
  width:700px;height:400px;
  background:radial-gradient(ellipse,#1e8a2e22 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

.shell{
  position:relative;z-index:1;
  max-width:820px;margin:0 auto;padding:48px 24px 80px;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;gap:20px;margin-bottom:10px;
}

.logo-wrap{position:relative;flex-shrink:0}
.logo-wrap svg{filter:drop-shadow(0 0 12px #27ae3f55)}

.brand-block{flex:1}
.app-name{
  font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-1px;
  background:linear-gradient(135deg,#4ade6a,#1e8a2e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1;
}
.brand-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.brand-sub{font-size:12px;color:var(--cinza);letter-spacing:.5px}
.badge{
  font-size:9px;font-weight:700;letter-spacing:.8px;
  background:#3d0e0e;color:#ff7070;
  border:1px solid #5a1a1a;
  padding:2px 8px;border-radius:4px;text-transform:uppercase;
}

/* dev link — canto, discreto */
.dev-link{
  position:fixed;bottom:14px;right:16px;z-index:99;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;color:var(--verde-dim);
  text-decoration:none;opacity:.5;
  transition:opacity .2s,color .2s;
}
.dev-link:hover{opacity:1;color:var(--cinza)}

/* ── DIVISOR ── */
.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--verde),transparent);
  margin:20px 0 32px;
}

/* ── CARD ── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:28px 32px;
  margin-bottom:16px;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--verde-lt),transparent);
}

/* ── CAMPOS ── */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:540px){.fields{grid-template-columns:1fr}}

.field-group{display:flex;flex-direction:column;gap:6px}
.field-label{
  font-size:10px;font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--cinza);
}
.field-input{
  background:var(--input-bg);
  border:1px solid var(--border);
  border-bottom:2px solid var(--verde);
  color:var(--branco);
  font-family:'Syne',sans-serif;font-size:15px;
  padding:12px 14px;border-radius:8px 8px 0 0;
  outline:none;transition:border-color .2s,box-shadow .2s;
  width:100%;
}
.field-input:focus{
  border-color:var(--verde-lt);
  box-shadow:0 0 0 3px var(--verde-glow);
}
.field-input::placeholder{color:var(--cinza);opacity:.5}

.corr-msg{
  font-size:10px;color:var(--accent);
  font-family:'JetBrains Mono',monospace;
  min-height:18px;margin-top:10px;letter-spacing:.3px;
}

/* ── BOTÃO ── */
.btn-main{
  width:100%;margin-top:20px;
  background:linear-gradient(135deg,var(--verde-lt),var(--verde));
  color:#fff;border:none;
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;
  padding:16px;border-radius:10px;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 24px #1e8a2e44;
}
.btn-main::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#ffffff18,transparent);
}
.btn-main:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 8px 32px #27ae3f55;
}
.btn-main:active:not(:disabled){transform:translateY(0)}
.btn-main:disabled{
  background:var(--verde-dim);cursor:not-allowed;
  box-shadow:none;transform:none;opacity:.7;
}

/* ── PROGRESSO ── */
.prog-wrap{
  background:var(--input-bg);border-radius:6px;
  height:6px;margin-top:16px;overflow:hidden;
}
.prog-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--verde),var(--accent));
  border-radius:6px;
  transition:width .4s ease;
  box-shadow:0 0 8px var(--accent);
}

/* ── CORPO INFERIOR: log + histórico ── */
.body-grid{
  display:grid;grid-template-columns:1fr 220px;gap:16px;
  margin-top:16px;
}
@media(max-width:640px){.body-grid{grid-template-columns:1fr}}

/* ── LOG ── */
.log-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.log-head{
  padding:10px 16px;border-bottom:1px solid var(--border);
  font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--cinza);
  display:flex;align-items:center;gap:8px;
}
.dot-live{
  width:7px;height:7px;border-radius:50%;
  background:var(--danger);
  box-shadow:0 0 6px var(--danger);
  display:none;
}
.dot-live.on{display:block;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

#log-area{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--log);line-height:1.9;
  padding:14px 16px;height:220px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}

/* ── HISTÓRICO ── */
.hist-card{
  background:var(--card2);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;
}
.hist-head{
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:10px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--cinza);
}
#hist-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.hist-item{
  padding:10px 14px;border-bottom:1px solid #0d1a0e;
  cursor:pointer;transition:background .15s;
}
.hist-item:hover{background:var(--input-bg)}
.hist-cidade{font-size:11px;font-weight:700;color:var(--branco)}
.hist-nicho{font-size:10px;color:var(--cinza);margin-top:2px}
.hist-meta{
  display:flex;justify-content:space-between;
  font-size:9px;color:var(--verde-dim);margin-top:4px;
  font-family:'JetBrains Mono',monospace;
}
.hist-badge{
  font-size:8px;padding:2px 6px;border-radius:3px;font-weight:700;
}
.status-concluido{background:#0d3b1a;color:#4ade6a}
.status-rodando{background:#1a2e0d;color:var(--warn)}
.status-erro{background:#3d0e0e;color:var(--danger)}
.hist-empty{padding:20px 14px;font-size:10px;color:var(--verde-dim);text-align:center;font-family:'JetBrains Mono',monospace}

/* ── DOWNLOAD ── */
.dl-wrap{
  display:none;margin-top:16px;
  background:linear-gradient(135deg,#0d3b1a,#0a2e12);
  border:1px solid var(--verde);border-radius:12px;
  padding:18px 24px;
  align-items:center;justify-content:space-between;gap:16px;
}
.dl-wrap.show{display:flex}
.dl-info{font-size:12px;color:var(--accent)}
.dl-info small{display:block;color:var(--cinza);font-size:10px;margin-top:3px}
.btn-dl{
  background:var(--verde);color:#fff;border:none;
  font-family:'Syne',sans-serif;font-size:12px;font-weight:700;
  padding:10px 20px;border-radius:8px;cursor:pointer;
  white-space:nowrap;transition:background .15s;
}
.btn-dl:hover{background:var(--verde-lt)}

/* ── STATUS BADGE ── */
.status-line{
  font-size:10px;font-family:'JetBrains Mono',monospace;
  margin-top:10px;color:var(--cinza);text-align:center;min-height:16px;
}
</style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <header>
    <div class="logo-wrap">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <polygon points="32,3 58,18 58,46 32,61 6,46 6,18"
                 fill="#1e8a2e" stroke="#27ae3f" stroke-width="1.5"/>
        <polyline points="16,47 16,21 32,36 48,21 48,47"
                  fill="none" stroke="white" stroke-width="6.5"
                  stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-block">
      <div class="app-name">MCLeadProspecta</div>
      <div class="brand-row">
        <span class="brand-sub">Memocash Soluções</span>
        <span class="badge">pré-beta v0.0.0.1</span>
      </div>
    </div>
  </header>

  <div class="divider"></div>

  <!-- FORMULÁRIO -->
  <div class="card">
    <div class="fields">
      <div class="field-group">
        <label class="field-label" for="cidade">Cidade</label>
        <input class="field-input" id="cidade" placeholder="ex: São Paulo, Curitiba..."
               autocomplete="off" spellcheck="false"/>
      </div>
      <div class="field-group">
        <label class="field-label" for="nicho">Nicho</label>
        <input class="field-input" id="nicho" placeholder="ex: pizzaria, barbearia..."
               autocomplete="off" spellcheck="false"/>
      </div>
    </div>

    <div class="corr-msg" id="corr-msg"></div>

    <button class="btn-main" id="btn-gerar" onclick="iniciar()">
      ▶ &nbsp; Gerar Leads
    </button>

    <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
    <div class="status-line" id="status-line"></div>
  </div>

  <!-- DOWNLOAD -->
  <div class="dl-wrap" id="dl-wrap">
    <div class="dl-info">
      <span>✅ Planilha pronta!</span>
      <small id="dl-nome">—</small>
    </div>
    <button class="btn-dl" id="btn-dl">⬇ Baixar Excel</button>
  </div>

  <!-- LOG + HISTÓRICO -->
  <div class="body-grid">
    <div class="log-card">
      <div class="log-head">
        <div class="dot-live" id="dot-live"></div>
        Log em tempo real
      </div>
      <div id="log-area"></div>
    </div>

    <div class="hist-card">
      <div class="hist-head">Histórico</div>
      <div id="hist-list"><div class="hist-empty">Nenhuma busca ainda</div></div>
    </div>
  </div>

</div><!-- /shell -->

<!-- dev credit — discreto, canto inferior direito -->
<a class="dev-link" href="https://github.com/laossim" target="_blank" rel="noopener">
  @laossim
</a>

<script>
let currentJob = null;
let pollInterval = null;
let logIndex = 0;

const btn     = document.getElementById('btn-gerar');
const prog    = document.getElementById('prog-bar');
const statusL = document.getElementById('status-line');
const logArea = document.getElementById('log-area');
const dlWrap  = document.getElementById('dl-wrap');
const dlNome  = document.getElementById('dl-nome');
const btnDl   = document.getElementById('btn-dl');
const corrMsg = document.getElementById('corr-msg');
const dot     = document.getElementById('dot-live');

// Enter navega entre campos
document.getElementById('cidade').addEventListener('keydown', e => {
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('nicho').focus(); }
});
document.getElementById('nicho').addEventListener('keydown', e => {
  if(e.key==='Enter'){ e.preventDefault(); iniciar(); }
});

// auto-correção ao sair do campo
['cidade','nicho'].forEach(id => {
  document.getElementById(id).addEventListener('blur', async () => {
    const cidade = document.getElementById('cidade').value.trim();
    const nicho  = document.getElementById('nicho').value.trim();
    if(!cidade && !nicho) return;
    const res = await fetch('/corrigir',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cidade,nicho})});
    const d = await res.json();
    const msgs=[];
    if(cidade && d.cidade!==cidade){
      document.getElementById('cidade').value=d.cidade;
      msgs.push(`Cidade: "${cidade}" → "${d.cidade}"`);
    }
    if(nicho && d.nicho!==nicho){
      document.getElementById('nicho').value=d.nicho;
      msgs.push(`Nicho: "${nicho}" → "${d.nicho}"`);
    }
    corrMsg.textContent = msgs.length ? '✔ Corrigido: '+msgs.join('   |   ') : '';
  });
});

function appendLog(lines){
  lines.forEach(l => {
    const span=document.createElement('span');
    span.textContent=l;
    logArea.appendChild(span);
  });
  logArea.scrollTop=logArea.scrollHeight;
}

function setStatus(txt,cor){
  statusL.textContent=txt;
  statusL.style.color=cor||'var(--cinza)';
}

async function iniciar(){
  const cidade=document.getElementById('cidade').value.trim();
  const nicho =document.getElementById('nicho').value.trim();
  if(!cidade||!nicho){ setStatus('⚠ Preencha cidade e nicho.','var(--warn)'); return; }

  btn.disabled=true; btn.textContent='⏳  Processando...';
  prog.style.width='0%';
  logArea.innerHTML=''; logIndex=0;
  dlWrap.classList.remove('show');
  corrMsg.textContent='';
  dot.classList.add('on');
  setStatus('Iniciando...','var(--cinza)');

  const res = await fetch('/iniciar',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cidade,nicho})});
  const d = await res.json();
  if(d.erro){ setStatus('❌ '+d.erro,'var(--danger)'); resetBtn(); return; }

  currentJob=d.job_id;
  if(d.cidade!==cidade || d.nicho!==nicho){
    corrMsg.textContent=`✔ Corrigido: Cidade "${cidade}" → "${d.cidade}"  |  Nicho "${nicho}" → "${d.nicho}"`;
  }

  pollInterval=setInterval(poll,900);
  carregarHistorico();
}

async function poll(){
  if(!currentJob) return;
  try{
    const res=await fetch(`/status/${currentJob}`);
    const d=await res.json();

    // novos logs
    if(d.log && d.log.length>logIndex){
      appendLog(d.log.slice(logIndex));
      logIndex=d.log.length;
    }

    prog.style.width=d.progress+'%';

    if(d.status==='concluido'){
      clearInterval(pollInterval);
      dot.classList.remove('on');
      setStatus(`✅ ${d.total} leads gerados!`,'var(--accent)');
      btn.disabled=false; btn.textContent='▶  Nova Busca';
      dlNome.textContent=d.file_name;
      btnDl.onclick=()=>{ window.location.href=`/download/${currentJob}`; };
      dlWrap.classList.add('show');
      carregarHistorico();
    } else if(d.status==='erro'){
      clearInterval(pollInterval);
      dot.classList.remove('on');
      setStatus('❌ Erro durante a coleta.','var(--danger)');
      resetBtn();
    } else {
      setStatus(`⏳ ${d.progress}% concluído — ${d.total||'?'} locais encontrados`,'var(--cinza)');
    }
  }catch(e){ /* ignora falhas de rede pontuais */ }
}

function resetBtn(){
  btn.disabled=false; btn.textContent='▶  Gerar Leads';
  dot.classList.remove('on');
}

async function carregarHistorico(){
  const res  = await fetch('/historico');
  const hist = await res.json();
  const ul   = document.getElementById('hist-list');
  if(!hist.length){
    ul.innerHTML='<div class="hist-empty">Nenhuma busca ainda</div>';
    return;
  }
  ul.innerHTML=hist.map(h=>{
    const st = h.status==='concluido'
      ? `<span class="hist-badge status-concluido">${h.total} leads</span>`
      : h.status==='erro'
      ? `<span class="hist-badge status-erro">erro</span>`
      : `<span class="hist-badge status-rodando">rodando</span>`;
    const dt = h.criado_em.slice(0,16).replace('T',' ');
    return `<div class="hist-item" onclick="reusarBusca('${h.cidade}','${h.nicho}')">
      <div class="hist-cidade">${h.cidade}</div>
      <div class="hist-nicho">${h.nicho}</div>
      <div class="hist-meta"><span>${dt}</span>${st}</div>
    </div>`;
  }).join('');
}

function reusarBusca(cidade,nicho){
  document.getElementById('cidade').value=cidade;
  document.getElementById('nicho').value=nicho;
  corrMsg.textContent='';
  document.getElementById('cidade').focus();
}

// carrega histórico ao abrir
carregarHistorico();
</script>
</body>
</html>
