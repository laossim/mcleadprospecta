<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCLeadProspecta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07100a;--card:#0d1f10;--border:#1a3320;
  --green:#1e8a2e;--green-hi:#34d058;--green-dim:#0f2214;
  --text:#d4edd8;--sub:#4a7d52;--faint:#1e3d22;
  --input:#0a1a0c;--ph:#2a5030;
  --dot:rgba(52,208,88,.05);
  --err:#e05252;--err-bg:#1c0808;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --tab-active:#34d058;
  --row-odd:#0b1a0d;--row-even:#0d1f10;--row-hover:#112416;
  --th-bg:#0a1a0c;--td-brd:#152a18;
  --badge-ok-bg:#0b2e10;--badge-ok-c:#34d058;
  --badge-warn-bg:#2a1e08;--badge-warn-c:#f0a500;
}
[data-theme="light"]{
  --bg:#f2faf2;--card:#fff;--border:#c8e6c9;
  --green:#1e8a2e;--green-hi:#176e22;--green-dim:#e8f5e9;
  --text:#1a2e1c;--sub:#4a7d52;--faint:#c8e6c9;
  --input:#e8f5e9;--ph:#8aab8e;
  --dot:rgba(30,138,46,.06);
  --err:#c62828;--err-bg:#ffebee;
  --shadow:0 4px 24px rgba(0,0,0,.08);
  --row-odd:#f8fdf8;--row-even:#ffffff;--row-hover:#e8f5e9;
  --th-bg:#e8f5e9;--td-brd:#c8e6c9;
  --badge-ok-bg:#e8f5e9;--badge-ok-c:#176e22;
  --badge-warn-bg:#fff8e1;--badge-warn-c:#f57f17;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:28px 20px 52px;transition:background-color .3s,color .3s;
}

/* HEADER */
.hdr{width:100%;max-width:980px;display:flex;align-items:center;margin-bottom:14px}
h1{font-family:'Inter',sans-serif;font-size:1.65rem;font-weight:900;
  color:var(--green-hi);letter-spacing:-1.5px;line-height:1;text-transform:uppercase}
.hdr-sp{flex:1}
#themeBtn{background:none;border:1px solid var(--border);border-radius:8px;
  padding:5px 10px;cursor:pointer;font-size:.9rem;color:var(--sub);
  transition:all .2s}
#themeBtn:hover{border-color:var(--green-hi);color:var(--green-hi)}

.sep{width:100%;max-width:980px;height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
  margin:0 0 20px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:24px;width:100%;max-width:980px;margin-bottom:12px;
  box-shadow:var(--shadow);transition:background .3s}

/* INPUTS */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:6px}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
.field label{display:block;font-size:.6rem;font-weight:700;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.field input{width:100%;background:var(--input);border:none;
  border-bottom:2px solid var(--border);color:var(--text);
  font-size:.97rem;padding:9px 11px;outline:none;border-radius:5px 5px 0 0;
  transition:border-color .2s}
.field input:focus{border-bottom-color:var(--green-hi)}
.field input::placeholder{color:var(--ph)}
.hint{font-size:.69rem;color:var(--green-hi);min-height:16px;
  margin:5px 0 14px;font-style:italic}

/* BTN ROW */
.row-btn{display:flex;gap:8px}
#btn{flex:1;padding:13px;background:var(--green);color:#fff;
  font-size:.9rem;font-weight:700;border:none;border-radius:9px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:8px;transition:background .2s}
#btn:hover:not(:disabled){background:var(--green-hi)}
#btn:disabled{opacity:.38;cursor:not-allowed}
#btnC{padding:13px 18px;background:transparent;color:var(--err);
  font-size:.82rem;border:1px solid var(--err-bg);border-radius:9px;
  cursor:pointer;display:none;transition:all .2s}
#btnC:hover{background:var(--err-bg)}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;
  display:none;animation:blink .9s infinite}
#btn.busy .dot{display:block}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.1;transform:scale(.4)}}

/* PROGRESS */
.pbar-wrap{margin-top:11px;background:var(--input);border-radius:99px;
  height:4px;overflow:hidden}
#pbar{height:100%;width:0%;
  background:linear-gradient(90deg,var(--green),var(--green-hi));
  border-radius:99px;transition:width .4s ease}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  margin-top:14px;border:1px solid var(--border);border-radius:10px;
  overflow:hidden}
@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:12px 8px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-val{font-size:1.4rem;font-weight:800;color:var(--green-hi);
  line-height:1;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:.57rem;color:var(--sub);text-transform:uppercase;
  letter-spacing:.9px;margin-top:3px}

/* ATUAL / CONCLUÍDO */
.atual-box{margin-top:10px;padding:8px 13px;
  background:var(--green-dim);border-radius:7px;
  border-left:3px solid var(--green);display:none;
  transition:opacity .6s}
.atual-box span{font-size:.74rem;color:var(--text);
  font-family:'Consolas',monospace}
.atual-box span b{color:var(--green-hi)}

/* ERRO / DL */
#erro{display:none;margin-top:10px;font-size:.77rem;color:var(--err);
  text-align:center;padding:7px;background:var(--err-bg);border-radius:7px}
#dl{display:none;margin-top:11px;text-align:center}
#dl a{display:inline-block;background:var(--green);color:#fff;
  border-radius:9px;padding:10px 32px;font-size:.88rem;font-weight:700;
  text-decoration:none;transition:background .2s}
#dl a:hover{background:var(--green-hi)}
.report-area{margin-top:9px;text-align:center}
.report-link{font-size:.7rem;color:var(--faint);background:none;border:none;
  cursor:pointer;text-decoration:underline;transition:color .2s;padding:0}
.report-link:hover{color:var(--sub)}

/* TABS */
.tabs-wrap{width:100%;max-width:980px}
.tab-btns{display:flex;border-bottom:2px solid var(--border)}
.tab-btn{padding:9px 22px;background:none;border:none;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  cursor:pointer;font-size:.71rem;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--sub);transition:color .2s,border-color .2s}
.tab-btn:hover{color:var(--green-hi)}
.tab-btn.active{color:var(--green-hi);border-bottom-color:var(--green-hi)}
.tab-pane{display:none;background:var(--card);border:1px solid var(--border);
  border-top:none;border-radius:0 0 12px 12px;overflow:hidden;
  box-shadow:var(--shadow)}
.tab-pane.active{display:block}

/* TABELA DE LEADS */
.table-wrap{overflow-x:auto;max-height:360px;overflow-y:auto}
table.leads{width:100%;border-collapse:collapse;font-size:.78rem}
table.leads thead{position:sticky;top:0;z-index:1}
table.leads th{background:var(--th-bg);color:var(--sub);
  font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:9px 12px;text-align:left;border-bottom:1px solid var(--td-brd);
  white-space:nowrap}
table.leads td{padding:8px 12px;border-bottom:1px solid var(--td-brd);
  vertical-align:middle;color:var(--text)}
table.leads tr:nth-child(odd) td{background:var(--row-odd)}
table.leads tr:nth-child(even) td{background:var(--row-even)}
table.leads tr:hover td{background:var(--row-hover)}
.td-id{color:var(--sub);font-size:.7rem;white-space:nowrap;width:52px}
.td-nome{font-weight:600;max-width:200px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.td-bairro{color:var(--sub);max-width:120px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.td-contato{font-family:'Consolas',monospace;font-size:.75rem;
  max-width:160px;white-space:nowrap}
.badge-ok{display:inline-flex;align-items:center;gap:4px;
  background:var(--badge-ok-bg);color:var(--badge-ok-c);
  font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:99px;
  white-space:nowrap}
.badge-warn{display:inline-flex;align-items:center;gap:4px;
  background:var(--badge-warn-bg);color:var(--badge-warn-c);
  font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:99px;
  white-space:nowrap}
.td-hora{color:var(--sub);font-size:.68rem;white-space:nowrap;
  text-align:right}
.table-empty{padding:40px;text-align:center;color:var(--sub);
  font-size:.8rem;font-style:italic}

/* HISTORICO */
.hist-toolbar{display:flex;justify-content:flex-end;
  padding:6px 12px;border-bottom:1px solid var(--border)}
.hist-toolbar button{background:none;border:none;color:var(--sub);
  cursor:pointer;font-size:.67rem;transition:color .2s}
.hist-toolbar button:hover{color:var(--green-hi)}
#hist{overflow-y:auto;max-height:360px}
.hi{padding:11px 14px;border-bottom:1px solid var(--td-brd);
  cursor:pointer;transition:background .15s}
.hi:last-child{border:none}
.hi:hover{background:var(--row-hover)}
.hi-c{font-size:.85rem;font-weight:600;color:var(--text)}
.hi-n{font-size:.72rem;color:var(--sub);margin-top:2px}
.hi-f{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.hi-d{font-size:.63rem;color:var(--sub)}
.hi-empty{padding:32px;text-align:center;font-size:.77rem;
  color:var(--sub);font-style:italic}
.b-ok{background:var(--badge-ok-bg);color:var(--badge-ok-c);
  font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:99px}
.b-run{background:var(--green-dim);color:var(--green-hi);
  font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:99px}
.b-err{background:#2e0b0b;color:#f87171;
  font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:99px}
[data-theme="light"] .b-err{background:#ffebee;color:#c62828}

/* MODAL */
#reportModal{display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);z-index:100;
  align-items:center;justify-content:center}
#reportModal.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:24px;width:90%;max-width:420px;
  box-shadow:var(--shadow)}
.modal-box h3{color:var(--green-hi);font-size:1rem;margin-bottom:6px}
.modal-box p{font-size:.77rem;color:var(--sub);margin-bottom:10px}
.modal-box textarea{width:100%;background:var(--input);
  border:1px solid var(--border);color:var(--text);border-radius:7px;
  padding:10px;font-size:.82rem;resize:vertical;min-height:80px;
  outline:none;font-family:inherit}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-btns button{flex:1;padding:10px;border-radius:8px;border:none;
  cursor:pointer;font-size:.82rem;font-weight:600}
#btnEnviar{background:var(--green);color:#fff}
#btnFechar{background:var(--input);color:var(--sub)}
#reportSt{font-size:.73rem;margin-top:8px;text-align:center;min-height:16px}

/* FOOTER */
footer{margin-top:22px;text-align:center}
#ghLink{color:var(--faint);display:inline-block;
  transition:color .2s,transform .2s}
#ghLink:hover{color:var(--green-hi);transform:scale(1.18)}
</style>
</head>
<body>

<div class="hdr">
  <h1>MCLeadProspecta</h1>
  <div class="hdr-sp"></div>
  <button id="themeBtn" onclick="toggleTheme()" title="Alternar tema">☀️</button>
</div>
<div class="sep"></div>

<div class="card">
  <div class="fields">
    <div class="field">
      <label>Cidade</label>
      <input id="iC" type="text" placeholder="ex: São Paulo, Curitiba" autocomplete="off">
    </div>
    <div class="field">
      <label>Nicho</label>
      <input id="iN" type="text" placeholder="ex: pizzaria, barbearia" autocomplete="off">
    </div>
  </div>
  <div class="hint" id="hint"></div>

  <div class="row-btn">
    <button id="btn" onclick="iniciar()">
      <span class="dot"></span>
      <span id="btnTxt">Gerar Leads</span>
    </button>
    <button id="btnC" onclick="cancelar()">Cancelar</button>
  </div>

  <div class="pbar-wrap"><div id="pbar"></div></div>

  <div class="stats" id="statsBar" style="display:none">
    <div class="stat">
      <div class="stat-val" id="sTotal">0</div>
      <div class="stat-lbl">Leads</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="sTel">0</div>
      <div class="stat-lbl">Com Telefone</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="sRate">-</div>
      <div class="stat-lbl">Leads / min</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="sEta">-</div>
      <div class="stat-lbl">Restante</div>
    </div>
  </div>

  <div class="atual-box" id="atualBox">
    <span id="atualTxt">&#8594; ...</span>
  </div>

  <div id="erro"></div>
  <div id="dl"><a id="dlLink" href="#">⬇ Baixar Planilha</a></div>
  <div class="report-area">
    <button class="report-link" onclick="abrirReport()">Reportar problema</button>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tab-btns">
    <button class="tab-btn active" id="tbLog" onclick="switchTab('log')">Log em Tempo Real</button>
    <button class="tab-btn" id="tbHist" onclick="switchTab('hist')">Histórico</button>
  </div>

  <div class="tab-pane active" id="tab-log">
    <div class="table-wrap">
      <table class="leads">
        <thead>
          <tr>
            <th>#</th>
            <th>Nome da Empresa</th>
            <th>Bairro / Local</th>
            <th>Contato</th>
            <th>Status</th>
            <th>Coletado</th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <tr><td colspan="6" class="table-empty">Aguardando início da coleta...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="tab-pane" id="tab-hist">
    <div class="hist-toolbar">
      <button onclick="limpar()">limpar histórico</button>
    </div>
    <div id="hist"><div class="hi-empty">nenhuma busca ainda</div></div>
  </div>
</div>

<footer>
  <a href="https://github.com/laossim" target="_blank" rel="noopener" id="ghLink">
    <svg viewBox="0 0 16 16" width="26" height="26" fill="currentColor">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>
</footer>

<div id="reportModal">
  <div class="modal-box">
    <h3>Reportar Problema</h3>
    <p>Descreva o que aconteceu. Os dados serão enviados automaticamente.</p>
    <textarea id="reportMsg" placeholder="ex: A busca retornou resultados fora do nicho..."></textarea>
    <div class="modal-btns">
      <button id="btnFechar" onclick="fecharReport()">Cancelar</button>
      <button id="btnEnviar" onclick="enviarReport()">Enviar</button>
    </div>
    <div id="reportSt"></div>
  </div>
</div>

<script>
// ── TEMA ──────────────────────────────────────────────────────────────────────
function aplicarTema(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('mc_tema', t);
}
function toggleTheme() {
  aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
aplicarTema(localStorage.getItem('mc_tema') || 'dark');

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  ['log','hist'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t === tab);
    document.getElementById('tb'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t === tab);
  });
}

// ── ESTADO ───────────────────────────────────────────────────────────────────
let jobId = null, poll = null, lastLogLen = 0, resultadosIdx = 0;
let hist  = JSON.parse(localStorage.getItem('mch') || '[]');

// ── INPUTS ────────────────────────────────────────────────────────────────────
document.getElementById('iC').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); document.getElementById('iN').focus(); }
});
document.getElementById('iN').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); iniciar(); }
});

async function corrigir() {
  const c = document.getElementById('iC').value.trim();
  const n = document.getElementById('iN').value.trim();
  if (!c && !n) return;
  try {
    const r = await fetch('/corrigir', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cidade:c,nicho:n}) });
    const d = await r.json();
    const msgs = [];
    if (d.cidade !== c) { document.getElementById('iC').value = d.cidade; msgs.push('Cidade: '+d.cidade); }
    if (d.nicho  !== n) { document.getElementById('iN').value = d.nicho;  msgs.push('Nicho: '+d.nicho);  }
    document.getElementById('hint').textContent = msgs.length ? 'Corrigido: '+msgs.join(' / ') : '';
  } catch(e) {}
}
document.getElementById('iC').addEventListener('blur', corrigir);
document.getElementById('iN').addEventListener('blur', corrigir);

// ── INICIAR ───────────────────────────────────────────────────────────────────
async function iniciar() {
  const c = document.getElementById('iC').value.trim();
  const n = document.getElementById('iN').value.trim();
  if (!c || !n) { setErro('Preencha cidade e nicho.'); return; }
  await corrigir();
  const cf = document.getElementById('iC').value.trim();
  const nf = document.getElementById('iN').value.trim();
  setBusy(true); resetUI(); setErro(''); setDl(false); setProg(0);
  switchTab('log');
  try {
    const r = await fetch('/iniciar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cidade:cf,nicho:nf}) });
    const d = await r.json();
    if (d.erro) { setErro(d.erro); setBusy(false); return; }
    jobId = d.job_id; resultadosIdx = 0;
    addHist(cf, nf, jobId);
    poll = setInterval(polling, 1500);
  } catch(e) { setErro('Erro de conexão.'); setBusy(false); }
}

async function cancelar() {
  if (!jobId) return;
  try { await fetch('/cancelar/'+jobId, {method:'POST'}); } catch(e) {}
  clearInterval(poll); setBusy(false);
}

// ── POLLING ───────────────────────────────────────────────────────────────────
async function polling() {
  if (!jobId) return;
  try {
    const url = '/status/'+jobId+'?from='+resultadosIdx;
    const r = await fetch(url);
    const d = await r.json();

    // Novos resultados → adiciona à tabela
    if (d.novos_resultados && d.novos_resultados.length) {
      d.novos_resultados.forEach((lead, i) => {
        addLeadRow(lead, resultadosIdx + i + 1, d.total);
      });
      resultadosIdx += d.novos_resultados.length;
    }

    if (d.progress) setProg(d.progress);
    if (d.total > 0) {
      document.getElementById('statsBar').style.display = 'grid';
      document.getElementById('sTotal').textContent = d.coletados || 0;
      document.getElementById('sTel').textContent   = d.com_telefone || 0;
      document.getElementById('sRate').textContent  = d.rate > 0 ? d.rate.toFixed(1) : '-';
      if (d.eta > 0) {
        const m = Math.floor(d.eta/60), s = d.eta%60;
        document.getElementById('sEta').textContent = m > 0 ? m+'m '+s+'s' : s+'s';
      }
      if (d.atual) setAtual('→ '+d.atual, false);
    }

    if (d.status === 'concluido') {
      clearInterval(poll); setBusy(false); setProg(100); setDl(true, jobId);
      updHist(jobId, 'ok'); renderHist();
      // Mostra mensagem de conclusão e some após 4s
      setAtual('✓ Coleta concluída — '+d.coletados+' leads, '+d.com_telefone+' com telefone', true);
      setTimeout(() => {
        const ab = document.getElementById('atualBox');
        ab.style.opacity = '0';
        setTimeout(() => { ab.style.display='none'; ab.style.opacity='1'; }, 700);
      }, 4000);
    }
    if (d.status === 'erro') {
      clearInterval(poll); setBusy(false);
      if (d.tem_parcial) setDl(true, jobId);
      else setErro('Erro durante a coleta.');
      updHist(jobId, 'err'); renderHist();
      const ab = document.getElementById('atualBox');
      ab.style.display = 'none';
    }
  } catch(e) {}
}

// ── TABELA ────────────────────────────────────────────────────────────────────
function extrairBairro(end) {
  if (!end || end === '-') return '-';
  const partes = end.split(',');
  if (partes.length >= 3) return partes[2].trim().split(/[-\d]/)[0].trim().substring(0,22);
  if (partes.length >= 2) return partes[1].trim().substring(0,22);
  return end.substring(0,22);
}

function addLeadRow(lead, idx, total) {
  const tbody = document.getElementById('leadsBody');
  // Remove estado vazio
  const empty = tbody.querySelector('td[colspan]');
  if (empty) empty.closest('tr').remove();

  const bairro  = extrairBairro(lead.endereco);
  const contato = lead.telefone || '-';
  const temTel  = !!lead.telefone;
  const statusHtml = temTel
    ? '<span class="badge-ok">✓ Contato Válido</span>'
    : '<span class="badge-warn">⚠ A verificar</span>';

  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td class="td-id">'+idx+(total?'/'+total:'')+'</td>'+
    '<td class="td-nome" title="'+esc(lead.nome)+'">'+esc(lead.nome)+'</td>'+
    '<td class="td-bairro">'+esc(bairro)+'</td>'+
    '<td class="td-contato">'+esc(contato)+'</td>'+
    '<td>'+statusHtml+'</td>'+
    '<td class="td-hora">'+(lead.hora||'-')+'</td>';
  tbody.appendChild(tr);

  // Auto-scroll
  const wrap = document.querySelector('.table-wrap');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function setAtual(msg, success) {
  const el = document.getElementById('atualBox');
  const txt = document.getElementById('atualTxt');
  txt.innerHTML = msg;
  el.style.borderLeftColor = success ? 'var(--green-hi)' : 'var(--green)';
  el.style.display = 'block';
  el.style.opacity = '1';
}
function setBusy(v) {
  const b = document.getElementById('btn');
  document.getElementById('btnTxt').textContent = v ? 'Processando...' : 'Gerar Leads';
  b.disabled = v; b.classList.toggle('busy', v);
  document.getElementById('btnC').style.display = v ? 'flex' : 'none';
}
function resetUI() {
  lastLogLen = 0; resultadosIdx = 0;
  document.getElementById('leadsBody').innerHTML =
    '<tr><td colspan="6" class="table-empty">Aguardando início da coleta...</td></tr>';
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('atualBox').style.display = 'none';
  document.getElementById('atualBox').style.opacity = '1';
  ['sTotal','sTel','sRate','sEta'].forEach(id => document.getElementById(id).textContent = '-');
}
function setProg(v) { document.getElementById('pbar').style.width = v+'%'; }
function setErro(m) {
  const el = document.getElementById('erro');
  el.textContent = m; el.style.display = m ? 'block' : 'none';
}
function setDl(v, jid) {
  document.getElementById('dl').style.display = v ? 'block' : 'none';
  if (jid) document.getElementById('dlLink').href = '/download/'+jid;
}

// ── HISTÓRICO ─────────────────────────────────────────────────────────────────
function addHist(c, n, jid) {
  hist = hist.filter(h => !(h.c===c && h.n===n));
  hist.unshift({c, n, jid, s:'run', d: new Date().toLocaleDateString('pt-BR')});
  if (hist.length > 20) hist.pop();
  localStorage.setItem('mch', JSON.stringify(hist)); renderHist();
}
function updHist(jid, s) {
  const h = hist.find(x => x.jid===jid);
  if (h) { h.s=s; localStorage.setItem('mch', JSON.stringify(hist)); }
}
function limpar() { hist=[]; localStorage.setItem('mch','[]'); renderHist(); }
function renderHist() {
  const el = document.getElementById('hist');
  if (!hist.length) { el.innerHTML='<div class="hi-empty">nenhuma busca ainda</div>'; return; }
  el.innerHTML = hist.map(h =>
    '<div class="hi" onclick="preencher(\''+esc(h.c)+'\',\''+esc(h.n)+'\')">'+
    '<div class="hi-c">'+esc(h.c)+'</div>'+
    '<div class="hi-n">'+esc(h.n)+'</div>'+
    '<div class="hi-f">'+
    '<span class="hi-d">'+(h.d||'')+'</span>'+
    '<span class="'+(h.s==='ok'?'b-ok':h.s==='err'?'b-err':'b-run')+'">'+
    (h.s==='ok'?'ok':h.s==='err'?'erro':'rodando')+'</span>'+
    '</div></div>'
  ).join('');
}
function preencher(c, n) {
  document.getElementById('iC').value = c;
  document.getElementById('iN').value = n;
  document.getElementById('hint').textContent = '';
}

// ── REPORTE ───────────────────────────────────────────────────────────────────
function abrirReport() {
  document.getElementById('reportModal').classList.add('show');
  document.getElementById('reportSt').textContent = '';
  document.getElementById('reportMsg').value = '';
}
function fecharReport() { document.getElementById('reportModal').classList.remove('show'); }
async function enviarReport() {
  const msg    = document.getElementById('reportMsg').value.trim();
  const meta   = {
    userAgent: navigator.userAgent,
    screen:    window.screen.width+'x'+window.screen.height,
    tema:      document.documentElement.getAttribute('data-theme')||'dark',
    cidade:    document.getElementById('iC').value.trim(),
    nicho:     document.getElementById('iN').value.trim(),
  };
  const st = document.getElementById('reportSt');
  st.textContent = 'Enviando...'; st.style.color = 'var(--green-hi)';
  try {
    const r = await fetch('/reportar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mensagem:msg, log:'', meta})
    });
    const d = await r.json();
    if (d.ok) { st.textContent='Enviado! Obrigado.'; setTimeout(fecharReport,2000); }
    else { st.style.color='var(--err)'; st.textContent='Erro: '+(d.erro||'falha'); }
  } catch(e) { st.style.color='var(--err)'; st.textContent='Falha ao enviar.'; }
}
document.getElementById('reportModal').addEventListener('click', function(e) {
  if (e.target===this) fecharReport();
});

renderHist();
</script>
